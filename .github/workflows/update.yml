name: Update Dependencies and Linters
on:
  schedule:
    - cron: '30 8 * * 5'  # Friday 18:00 UTC+9:30
  workflow_dispatch:

jobs:
  refresh-dependencies-and-linters:
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: write
      pull-requests: write
    env:
      UV_PYTHON: 3.14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Loosen bounds (workflow only)
        run: uv run scripts/manage_dependency_bounds.py loosen-bounds
      - name: Upgrade dependencies
        run: uv sync --upgrade --all-extras
      - name: Restore upper bounds
        run: uv run scripts/manage_dependency_bounds.py add-bounds
      - name: Re-lock with pinned versions
        run: uv lock
      - name: Install prek
        run: uv tool install prek
      - name: Run prek autoupdate --cooldown-days 7
        run: prek autoupdate --cooldown-days 7
      - name: Check for changes
        id: check_diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Generate token
        if: steps.check_diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: generate-token
        with:
          app-id: ${{ secrets.AUTH_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create PR with updated deps and linters
        if: steps.check_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "chore: refresh dependencies and linters"
          title: "chore: refresh dependencies and linters"
          body: |
            This PR upgrades dependencies via `uv sync --upgrade --all-extras`,
            refreshes `uv.lock`, updates `prek.toml` by running
            `prek autoupdate --cooldown-days 7`.
          branch: bot/update-deps-and-linters
          author: GitHub Actions <actions@github.com>
          delete-branch: true
