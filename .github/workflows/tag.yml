name: Tag Release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

jobs:
  tag-version:
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Check for an untagged version
        id: version
        run: |
          version=$(uv version --short)
          if ! git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "untagged=$version" >> "$GITHUB_OUTPUT"
          fi
      # A tag pushed with GITHUB_TOKEN would not trigger release.yml.
      - name: Generate token
        if: steps.version.outputs.untagged
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: generate-token
        with:
          app-id: ${{ secrets.AUTH_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push tag
        if: steps.version.outputs.untagged
        env:
          TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.untagged }}
        run: |
          git tag "$VERSION"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$VERSION"
