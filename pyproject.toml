[dependency-groups]
dev = [
    "tomlkit>=0.13.2",
    "boto3-stubs[full]>=1.40.61",
    "packaging>=25.0",
    "coverage>=7.6.9",
    "freezegun>=1.5.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "types-aiobotocore>=2.24.1",
    "types-aiobotocore-full>=2.24.1",
    "s3fs>=2024.6.0",
    "pytest-randomly>=4.0.1",
    "pytest-xdist[psutil]>=3.8.0",
    "pandas>=2.2.0,<=3.0.5",
    "pyarrow>=22.0.0",
    "pandas-stubs>=2.3.3.251201",
    # Gated on Windows 3.14+ until pywin32 free-threaded wheels land:
    # https://github.com/mhammond/pywin32/issues/2303
    "moto[server]>=5.1.5,<=5.2.3; python_full_version < \"3.14\" or sys_platform != \"win32\"",
    "polars>=1.35.1,<=1.44.1",
]
ft-test = [
    "coverage>=7.6.9",
    "freezegun>=1.5.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-randomly>=4.0.1",
    "pytest-xdist[psutil]>=3.8.0",
    "s3fs>=2024.6.0",
]
docs = ["zensical==0.0.42"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
# Exempt pydantic-settings from the 7-day cooldown so the resolver may pick
# 2.14.2, which fixes GHSA-4xgf-cpjx-pc3j.
exclude-newer-package = { pydantic-settings = false }
