[project]
name = "aiomoto"
version = "0.5.4"
description = "Moto-style AWS service mocks for aiobotocore"
readme = "README.md"
authors = [
    { name = "Owen Lamont", email = "owenrlamont@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "aws",
    "moto",
    "aiobotocore",
    "asyncio",
    "testing",
    "mocks",
]
dependencies = [
    "aiobotocore>=2.24.1,<=3.9.0",
    "moto>=5.1.5,<=5.2.3",
    "platformdirs>=4.0.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/owenlamont/aiomoto"
Issues = "https://github.com/owenlamont/aiomoto/issues"

